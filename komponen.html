
<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<title>Komponen Komputer</title>
<style>
body {
  font-family: Arial, sans-serif;
  background: #eaf2f8;
  text-align: center;
}

h1 {
  color: #123456;
}

.container {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 20px;
  padding: 20px;
}

.card {
  background: white;
  padding: 20px;
  border-radius: 15px;
  box-shadow: 0 3px 10px #999;
}

.card img {
  width: 150px;
  height: 120px;
  object-fit: contain;
}

.card h3 {
  color: #0077aa;
}
</style>
</head>

<body>

<h1>GAMBAR KOMPONEN KOMPUTER</h1>
<p>Berikut adalah beberapa komponen komputer</p>

<div class="container">

<div class="card">
<img src="https://placehold.co/150x120?text=Motherboard">
<h3>Motherboard</h3>
<p>Papan utama komputer.</p>
</div>

<div class="card">
<img src="https://placehold.co/150x120?text=Processor">
<h3>Processor</h3>
<p>Otak dari komputer.</p>
</div>

<div class="card">
<img src="https://placehold.co/150x120?text=RAM">
<h3>RAM</h3>
<p>Penyimpanan sementara.</p>
</div>

<div class="card">
<img src="https://placehold.co/150x120?text=VGA">
<h3>VGA Card</h3>
<p>Mengolah tampilan grafis.</p>
</div>

<div class="card">
<img src="https://placehold.co/150x120?text=SSD">
<h3>SSD</h3>
<p>Menyimpan data komputer.</p>
</div>

<div class="card">
<img src="https://placehold.co/150x120?text=PSU">
<h3>Power Supply</h3>
<p>Memberikan daya listrik.</p>
</div>

</div>

</body>
</html>
